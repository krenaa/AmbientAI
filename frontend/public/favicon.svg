<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ambGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ambGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="ambGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Rounded Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#09090B" stroke="url(#ambGrad1)" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Ambient Neural Isometric Core -->
  <polygon points="32,13 49,23 32,33 15,23" fill="url(#ambGrad1)" fill-opacity="0.85"/>
  <polygon points="15,23 32,33 32,51 15,41" fill="url(#ambGrad2)" fill-opacity="0.9"/>
  <polygon points="32,33 49,23 49,41 32,51" fill="url(#ambGrad1)" fill-opacity="0.45"/>
  <!-- Glowing Center Pulse Core -->
  <circle cx="32" cy="32.5" r="4.5" fill="#FFFFFF" filter="url(#ambGlow)"/>
  <circle cx="32" cy="32.5" r="2.5" fill="#06B6D4"/>
  <!-- Neural Nodes -->
  <circle cx="32" cy="13" r="2" fill="#38BDF8"/>
  <circle cx="49" cy="23" r="2" fill="#818CF8"/>
  <circle cx="49" cy="41" r="2" fill="#A78BFA"/>
  <circle cx="32" cy="51" r="2" fill="#34D399"/>
  <circle cx="15" cy="41" r="2" fill="#10B981"/>
  <circle cx="15" cy="23" r="2" fill="#38BDF8"/>
</svg>