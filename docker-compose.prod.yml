services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ambientdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ambientdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-ambientdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambientdesk_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ambient_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambientdesk_user} -d ${POSTGRES_DB:-ambientdesk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ambientdesk_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ambient_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    container_name: ambientdesk_ai_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ambientdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-ambientdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambientdesk_secret}
    networks:
      - ambient_network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: ambientdesk_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ambientdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-ambientdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambientdesk_secret}
      REDIS_URL: redis://redis:6379/0
      AI_AGENT_SERVICE_URL: http://ai-agent:8001
      DJANGO_DEBUG: "False"
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - ambient_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_started

  celery_worker:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: ambientdesk_celery
    restart: unless-stopped
    command: ["celery", "-A", "core", "worker", "-l", "info"]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ambientdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-ambientdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambientdesk_secret}
      REDIS_URL: redis://redis:6379/0
      AI_AGENT_SERVICE_URL: http://ai-agent:8001
    networks:
      - ambient_network
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ambientdesk_frontend
    restart: unless-stopped
    networks:
      - ambient_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ambientdesk_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
    networks:
      - ambient_network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  ambient_network:
    driver: bridge
