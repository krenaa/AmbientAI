services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ambientdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambientdesk_db
      POSTGRES_USER: ambientdesk_user
      POSTGRES_PASSWORD: ambientdesk_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambientdesk_user -d ambientdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ambientdesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: